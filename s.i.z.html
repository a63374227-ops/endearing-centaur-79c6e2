<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="صفحة ويب تم إنشاؤها باستخدام ويب باني">
  <title>صفحتي الجديدة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #ffffff;
      color: #1a1a2e;
      direction: rtl;
      line-height: 1.6;
    }
    .page-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }
    img {
      height: auto;
    }
    a {
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="page-container">
    <h2 style="font-size:28px;font-weight:bold;color:#1a1a2e;text-align:right;padding:8px">عنوان جديد</h2>
  </div>
</body>
</html>
